name: linux-gpui CI

on:
  push:
    paths:
      - 'linux-gpui/**'
      - 'packaging/**'
      - 'patches/**'
      - '.github/workflows/linux-gpui-ci.yml'
  pull_request:
    paths:
      - 'linux-gpui/**'
      - 'packaging/**'
      - 'patches/**'
      - '.github/workflows/linux-gpui-ci.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel rust cargo clang pkgconf git \
            wayland libxkbcommon freetype2 fontconfig vulkan-icd-loader

      - uses: actions/checkout@v4

      - name: Submodules and patches
        run: |
          git config --global --add safe.directory "$PWD"
          git submodule update --init --depth 1 third_party/ironrdp third_party/ryll
          git config --global --add safe.directory "$PWD/third_party/ironrdp"
          git config --global --add safe.directory "$PWD/third_party/ryll"
          ./patch.sh -n ironrdp ryll

      - name: Test
        working-directory: linux-gpui
        run: cargo test --locked

      - name: Build
        working-directory: linux-gpui
        run: cargo build --locked
